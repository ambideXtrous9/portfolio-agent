rules:
  - id: trailofbits.python.pickles-in-pytorch.pickles-in-pytorch
    severity: INFO
    message: "Ignoring torch.load in vision.py - checkpoints loaded with weights_only=True (no pickle deserialization)"
    metadata:
      confidence: HIGH
      ignored_reason: "weights_only=True is used, mitigating the pickle RCE vector"
    languages: [python]
    paths:
      include:
        - "backend/app/api/endpoints/vision.py"
