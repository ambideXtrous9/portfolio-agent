services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (Python 3.12 + MCP + ML Engines)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: streamlit-ai-portfolio-backend:latest
    container_name: ai-portfolio-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - RELOAD=false
      - PYTHONUNBUFFERED=1
      - DEFAULT_MODEL=${DEFAULT_MODEL:-openai/gpt-oss-120b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-hpvdb-openai}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/data:/app/backend/data
      - ./backend/models:/app/backend/models
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # Frontend SPA Service (Nginx Static Server & Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-portfolio-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # LiveKit Voice Agent Worker (LangGraph + WebRTC Audio AI)
  # ----------------------------------------------------------------------------
  voice-agent:
    image: streamlit-ai-portfolio-backend:latest
    container_name: ai-portfolio-voice-agent
    restart: unless-stopped
    command: ["python", "-m", "backend.app.voice_agent.agent", "dev"]
    healthcheck:
      disable: true
    volumes:
      - ./backend/app:/app/backend/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENWEATHER_API_KEY=${WEATHER_API_KEY:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # Cloudflare HTTPS Public Tunnel (Zero-config secure backend for Vercel)
  # ----------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ai-portfolio-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://backend:8000"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

