[project]
name = "app"
version = "0.2.0"
dependencies = [ "fastapi>=0.115.0", "uvicorn[standard]>=0.32.0", "websockets>=12.0", "python-multipart>=0.0.18", "sse-starlette>=2.2.0", "livekit-api>=1.2.0", "pandas>=2.2.0", "numpy>=1.26.0", "beautifulsoup4>=4.12.0", "lxml>=4.9.0", "yfinance>=0.2.40", "pillow>=10.0.0", "gnews>=0.2.0", "curl-cffi>=0.7.0", "langchain>=0.3.0", "langchain-core>=0.3.0", "langchain-groq>=0.2.0", "langchain-openai>=0.2.0", "langgraph>=0.2.0", "langgraph-checkpoint>=2.0.0", "langgraph-prebuilt>=0.1.0", "groq>=0.11.0", "openai>=1.50.0", "requests>=2.32.0", "httpx>=0.27.0", "pydantic>=2.9.0", "pydantic-settings>=2.5.0", "python-dotenv>=1.0.0", "psycopg>=3.2.0", "psycopg-binary>=3.2.0", "psycopg-pool>=3.2.0", "langgraph-checkpoint-postgres>=2.0.0", "langchain-postgres>=0.0.12", "pyjwt>=2.8.0", "pwdlib[argon2]>=0.2.0", "argon2-cffi>=23.1.0", "huggingface-hub>=0.24.0" ]
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The repo root also hosts the non-Python `frontend/` dir and the Vercel
# entry `api/index.py`; discovery must only pick up the `backend` tree.
[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
vision = [ "torch>=2.2.0", "torchvision>=0.17.0", "timm>=1.0.0", "pytorch-lightning>=2.0.0", "torchmetrics>=1.0.0", "ultralytics>=8.2.0" ]

[dependency-groups]
dev = [ "pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0" ]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
extend-exclude = ["backend/models", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "C4", "B"]
# B008: Depends() in argument defaults is idiomatic FastAPI
# E402: conditional/heavy imports (torch, models) are intentional
ignore = ["E501", "B008", "E402"]
