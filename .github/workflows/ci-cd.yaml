name: CI/CD Pipeline & Vercel Deployment

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment (production or preview)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      chat_id:
        description: 'Telegram Chat ID to notify (optional)'
        required: false
        default: ''
      trigger_source:
        description: 'Trigger Source (optional)'
        required: false
        default: 'Manual'

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}

jobs:
  # ============================================================================
  # 1. CI Validation: Python Syntax, JSON Schemas & Frontend Integrity
  # ============================================================================
  validate:
    name: Lint & Code Integrity Check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Telegram Notification (Pipeline Started)
        if: always()
        run: python3 backend/scripts/telegram_notify.py --event pipeline_start
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACTION: ${{ github.event.action }}

      - name: Validate JSON Configuration Files
        run: |
          echo "🔍 Validating vercel.json..."
          python -m json.tool vercel.json > /dev/null
          echo "✅ vercel.json syntax is valid"

      - name: Validate Python Backend Code Syntax
        run: |
          echo "🔍 Compiling Python backend modules..."
          python -m compileall -q backend/app/ api/
          echo "✅ All backend Python modules compiled cleanly"

      - name: Verify Frontend Web Assets
        run: |
          echo "🔍 Verifying frontend static distribution..."
          test -f frontend/index.html || { echo "❌ frontend/index.html missing"; exit 1; }
          test -f frontend/css/style.css || { echo "❌ frontend/css/style.css missing"; exit 1; }
          test -f frontend/js/app.js || { echo "❌ frontend/js/app.js missing"; exit 1; }
          echo "✅ Frontend static directory structure verified"

      - name: Telegram Notification (Validation Passed)
        if: success()
        run: python3 backend/scripts/telegram_notify.py --event validation_pass

      - name: Telegram Notification (Validation Failed)
        if: failure()
        run: python3 backend/scripts/telegram_notify.py --event validation_fail

  # ============================================================================
  # 2. CD Preview: Deploy Preview on Pull Requests
  # ============================================================================
  deploy-preview:
    name: Deploy to Vercel Preview
    needs: validate
    if: (github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22 (Active LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install uv (Required by Vercel Python runtime)
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information (Preview)
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Build Project Artifacts (Preview)
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy to Vercel (Preview)
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Vercel Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Preview URL: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 3. CD Production: Deploy to Vercel Production on Push or Merge PR to Main
  # ============================================================================
  deploy-production:
    name: Deploy to Vercel Production
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12 (For Telegram Alerts)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Telegram Notification (Deployment Started)
        if: always()
        run: python3 backend/scripts/telegram_notify.py --event deploy_start
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACTION: ${{ github.event.action }}

      - name: Setup Node.js 22 (Active LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install uv (Required by Vercel Python runtime)
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information (Production)
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts (Production)
        run: vercel build --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### 🎉 Vercel Production Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** [https://portfolio-agent-ai.vercel.app](https://portfolio-agent-ai.vercel.app)" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL (Alt):** [https://sushovan-ai-portfolio.vercel.app](https://sushovan-ai-portfolio.vercel.app)" >> $GITHUB_STEP_SUMMARY
          echo "**Alias URL:** [https://ambidextrous-portfolio.vercel.app](https://ambidextrous-portfolio.vercel.app)" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Alias:** $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Telegram Notification (Deployment Succeeded)
        if: success()
        run: python3 backend/scripts/telegram_notify.py --event deploy_success --url "${{ steps.deploy.outputs.url }}"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACTION: ${{ github.event.action }}

      - name: Telegram Notification (Deployment Failed)
        if: failure()
        run: python3 backend/scripts/telegram_notify.py --event deploy_fail
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACTION: ${{ github.event.action }}
